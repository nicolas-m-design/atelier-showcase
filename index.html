<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Watch Atelier: review five Robot UI screens, inspect the UI library and start a local branch preview.">
  <title>Atelier — Product review demo</title>
  <style>
    @font-face { font-family: Inter; src: url('assets/fonts/inter-latin-opsz-normal.woff2') format('woff2'); font-style: normal; font-weight: 100 900; font-display: swap; }
    :root { color-scheme: light; --foreground: #171717; --muted: #626262; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 24px; background: #f7f7f7; color: var(--foreground); font: 13px/20px Inter, sans-serif; font-variation-settings: "wght" 400, "opsz" 14; }
    main { max-width: 960px; margin-inline: auto; }
    h1, p { margin: 0; }
    h1 { font-size: 28px; line-height: 34px; font-variation-settings: "wght" 700, "opsz" 25; text-wrap: balance; }
    p { margin-top: 8px; color: var(--muted); text-wrap: pretty; }
    video { display: block; width: 100%; height: auto; aspect-ratio: 1710 / 1000; margin-top: 24px; background: #e8e8e8; }
    nav { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 16px; }
    a { color: var(--foreground); text-underline-offset: 3px; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--foreground); outline-offset: 5px; }
    ::selection { background: #d8d8d8; color: var(--foreground); }
    @media (max-width: 600px) { body { padding: 24px 16px; } }
  </style>
</head>
<body>
  <main>
    <h1>Atelier</h1>
    <p>Review five Robot UI screens, inspect the UI library and try a branch preview.</p>
    <video controls playsinline preload="metadata" poster="assets/atelier-demo-poster.png?v=robot-ui-2" aria-label="Atelier demo: screens, UI library and branch preview">
      <source src="assets/atelier-demo.mp4?v=robot-ui-2" type="video/mp4">
      <a href="assets/atelier-demo.mp4?v=robot-ui-2" download>Download the 33-second demo</a>.
    </video>
    <nav aria-label="Demo links">
      <a href="https://github.com/nicolas-m-design/atelier-showcase">View the showcase</a>
      <a href="assets/atelier-demo.mp4?v=robot-ui-2" download>Download MP4 · 0.8 MB</a>
      <a href="https://github.com/nicolas-m-design/atelier-showcase/blob/main/docs/demo-video.md#transcript">Read the transcript</a>
    </nav>
  </main>
</body>
</html>
